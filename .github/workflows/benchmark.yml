name: build-and-benchmark

on:
  push:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show machine
        run: |
          nproc
          lscpu | grep "Model name"

      - name: Build
        run: make

      - name: Run benchmark
        run: ./wqueue

      - name: Race check with ThreadSanitizer
        run: |
          make tsan
          ./wqueue_tsan
          
