name: build-and-benchmark

on:
  push:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show machine
        run: |
          nproc
          lscpu | grep "Model name"

      - name: Build
        run: make

      # timeout turns a shutdown bug (a thread that never wakes) into a
      # failed step instead of a job that hangs for six hours.
      - name: Unit tests
        run: timeout 120 make test

      - name: Unit tests under ThreadSanitizer
        run: timeout 600 make test-tsan

      - name: Run benchmark
        run: ./wqueue

      - name: Race check with ThreadSanitizer
        run: |
          make tsan
          ./wqueue_tsan
          
